<script>
  // Ensure globals exist for pdp-checkout.js IIFE (standalone page has no index.html lexical scope)
  window.selectedPdf = window.selectedPdf || null;
  window.wishlist = window.wishlist || [];

  // Configure PDF.js worker
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';
  }

  // Hydrate this standalone page: wait for PDFS + supabaseClient + renderDetail,
  // find the record matching __STATIC_PDF_ID__, then call renderDetail()
  // — the same pipeline used by the SPA #detail page, now in pdp-v2.js.
  (function waitAndRender(tries) {
    tries = tries || 0;
    if (window.PDFS && window.PDFS.length && typeof window.selectedPdf !== 'undefined' && typeof window.renderDetail === 'function') {
      const pdf = window.PDFS.find(p => String(p.id) === String(window.__STATIC_PDF_ID__));
      if (pdf) {
        window.selectedPdf = pdf;
        try {
          window.renderDetail();
          window.__staticHydrated = true;
          return;
        } catch (err) {
          // Never leave the page retry-looping on a render error — keep the
          // static skeleton content visible and surface the reason in console.
          console.error('[Studyria] renderDetail failed on static page:', err);
          return;
        }
      }
    }
    // 30s budget (200 x 150ms) — a first visit on a slow mobile network
    // (cold CDN downloads + DB fetch for the whole catalogue) can exceed 9s.
    if (tries < 200) return setTimeout(() => waitAndRender(tries + 1), 150);
    console.warn('[Studyria] Could not hydrate PDF detail — falling back to static content.');
  })();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
