<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 – Page Not Found | Studyria</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080c14; --text: #eef2ff; --text2: #7a8caa;
    --accent: #3d8ef8; --accent2: #00c8e8;
    --glass: rgba(255,255,255,0.055); --glass-border: rgba(255,255,255,0.09);
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body); background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(61,142,248,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 10%, rgba(0,200,232,0.05) 0%, transparent 55%);
  }
  .wrap {
    text-align: center; padding: 40px 24px; max-width: 520px;
    animation: fadeUp .6s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform:none; } }
  .num {
    font-family: var(--font-display); font-size: clamp(6rem, 20vw, 10rem); font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, #3d8ef8 0%, #00c8e8 60%, #b0e0ff 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 32px rgba(61,142,248,0.3));
    margin-bottom: 8px;
  }
  .title {
    font-family: var(--font-display); font-size: 1.8rem; font-weight: 700;
    margin-bottom: 12px;
  }
  .sub {
    color: var(--text2); font-size: .95rem; line-height: 1.7; margin-bottom: 32px; font-weight: 300;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 28px; border-radius: 10px;
    background: linear-gradient(135deg, #3d8ef8, #00c8e8);
    color: #fff; font-weight: 600; font-size: .95rem; text-decoration: none;
    box-shadow: 0 6px 24px rgba(61,142,248,0.4);
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(61,142,248,0.55); }
  .logo {
    font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; margin-bottom: 40px;
    background: linear-gradient(135deg, #3d8ef8, #00c8e8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    display: block;
  }
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="logo">Study<span style="font-weight:300">ria</span></a>
  <div class="num">404</div>
  <h1 class="title">Page Not Found</h1>
  <p class="sub">The page you're looking for has moved, been deleted, or never existed. Let's get you back to studying.</p>
  <a href="/" class="btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Back to Home
  </a>
</div>
</body>
</html>
