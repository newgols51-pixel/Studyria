<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #080c14;
    --bg2:          #0d1220;
    --text:         #eef2ff;
    --text2:        #7a8caa;
    --text3:        #4a5568;
    --accent:       #3d8ef8;
    --accent2:      #00c8e8;
    --gold:         #f59e0b;
    --danger:       #ff4d6d;
    --glass:        rgba(255,255,255,0.055);
    --glass-border: rgba(255,255,255,0.09);
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body:    'DM Sans', system-ui, sans-serif;
    --radius:       16px;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    background-image:
      radial-gradient(ellipse at 15% 50%, rgba(61,142,248,0.09) 0%, transparent 60%),
      radial-gradient(ellipse at 85% 10%, rgba(0,200,232,0.06) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 90%, rgba(139,92,246,0.05) 0%, transparent 50%);
  }

  /* ── Animated bg grid ────────────────────────────────────────── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(61,142,248,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61,142,248,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  /* ── Floating orbs ───────────────────────────────────────────── */
  .orb {
    position: fixed; border-radius: 50%; filter: blur(72px);
    pointer-events: none; z-index: 0; animation: drift 12s ease-in-out infinite alternate;
  }
  .orb-1 { width: 320px; height: 320px; background: rgba(61,142,248,0.07); top: -60px; left: -60px; animation-delay: 0s; }
  .orb-2 { width: 260px; height: 260px; background: rgba(0,200,232,0.06); bottom: -40px; right: -40px; animation-delay: -5s; }
  .orb-3 { width: 180px; height: 180px; background: rgba(139,92,246,0.05); top: 40%; left: 60%; animation-delay: -3s; }

  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(20px, 30px) scale(1.08); }
  }

  /* ── Main card ───────────────────────────────────────────────── */
  .wrap {
    position: relative; z-index: 1;
    text-align: center;
    padding: 48px 28px 40px;
    max-width: 540px;
    width: 100%;
    animation: fadeUp .55s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: none; }
  }

  /* ── Logo ────────────────────────────────────────────────────── */
  .logo {
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 800;
    margin-bottom: 44px;
    background: linear-gradient(135deg, #3d8ef8, #00c8e8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-block;
    text-decoration: none;
    letter-spacing: -.01em;
  }
  .logo span { font-weight: 300; }

  /* ── 404 number ──────────────────────────────────────────────── */
  .num {
    font-family: var(--font-display);
    font-size: clamp(5.5rem, 20vw, 9.5rem);
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #3d8ef8 0%, #00c8e8 55%, #b0e0ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 36px rgba(61,142,248,0.28));
    margin-bottom: 6px;
    animation: pulse 3.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 36px rgba(61,142,248,0.28)); }
    50%       { filter: drop-shadow(0 0 56px rgba(0,200,232,0.42)); }
  }

  /* ── Emoji icon ──────────────────────────────────────────────── */
  .icon {
    font-size: 2.8rem;
    margin-bottom: 18px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-8px); }
  }

  /* ── Text ────────────────────────────────────────────────────── */
  .title {
    font-family: var(--font-display);
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    font-weight: 700;
    margin-bottom: 12px;
    line-height: 1.25;
  }

  .sub {
    color: var(--text2);
    font-size: .92rem;
    line-height: 1.75;
    margin-bottom: 36px;
    font-weight: 300;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ── Buttons ─────────────────────────────────────────────────── */
  .btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 12px 24px;
    border-radius: 10px;
    font-weight: 600;
    font-size: .88rem;
    text-decoration: none;
    transition: transform .2s, box-shadow .2s;
    font-family: var(--font-body);
    cursor: pointer;
    border: none;
  }

  .btn-primary {
    background: linear-gradient(135deg, #3d8ef8, #00c8e8);
    color: #fff;
    box-shadow: 0 6px 24px rgba(61,142,248,0.4);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(61,142,248,0.55);
  }

  .btn-ghost {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--text2);
    backdrop-filter: blur(8px);
  }
  .btn-ghost:hover {
    border-color: var(--accent);
    color: var(--text);
    transform: translateY(-2px);
  }

  /* ── Quick links ─────────────────────────────────────────────── */
  .quick-links {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    padding-top: 24px;
    border-top: 1px solid var(--glass-border);
  }

  .quick-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    color: var(--text2);
    font-size: .78rem;
    font-weight: 500;
    padding: 10px 14px;
    border-radius: 10px;
    transition: all .18s;
    min-width: 72px;
  }
  .quick-link:hover {
    background: var(--glass);
    color: var(--text);
    transform: translateY(-2px);
  }
  .quick-link .ql-icon { font-size: 1.4rem; }

  /* ── Divider text ────────────────────────────────────────────── */
  .or-text {
    color: var(--text3);
    font-size: .72rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* ── Offline banner (hidden by default) ─────────────────────── */
  .offline-banner {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,77,109,0.15);
    border: 1px solid rgba(255,77,109,0.3);
    color: #ff4d6d;
    padding: 10px 20px;
    border-radius: 100px;
    font-size: .8rem;
    font-weight: 600;
    gap: 8px;
    align-items: center;
    z-index: 10;
    white-space: nowrap;
    backdrop-filter: blur(12px);
  }
  .offline-banner.show { display: flex; }

  /* ── Mobile ──────────────────────────────────────────────────── */
  @media (max-width: 480px) {
    .wrap { padding: 36px 20px 32px; }
    .quick-links { gap: 12px; }
    .quick-link { min-width: 60px; padding: 8px 10px; }
  }
</style>

</div>

<script>
  // ── Offline detection ──────────────────────────────────────────
  const banner = document.getElementById('offlineBanner');
  function syncOnline() {
    banner.classList.toggle('show', !navigator.onLine);
  }
  syncOnline();
  window.addEventListener('online',  syncOnline);
  window.addEventListener('offline', syncOnline);

  // ── Quick-link SPA navigation support ────────────────────────
  // If the main app is a SPA (single index.html), the /?page= links
  // above will work as-is. If you use hash routing, swap to:
  //   href="/#career-hub" etc.
  // No change needed here — routing is handled by index.html.

  // ── Register / update service worker if present ───────────────
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg) reg.update();
    });
  }
</script>
