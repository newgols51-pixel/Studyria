<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="robots" content="noindex">
<title>hydration debug</title>
<style>body{font:12px/1.5 monospace;margin:0;padding:8px;background:#fff}#dbg{white-space:pre-wrap;word-break:break-all}</style>
</head><body>
<pre id="dbg">START
</pre>
<script>
(function(){
  var lines = ['START'];
  var pre = document.getElementById('dbg');
  function log(m){ lines.push(m); try{ pre.textContent = lines.join('\n'); }catch(e){} }
  window.__log = log;
  window.addEventListener('error', function(e){ log('ONERROR: ' + (e.message||'') + ' @ ' + (e.filename||'') + ':' + (e.lineno||'') + (e.error && e.error.stack ? '\n' + String(e.error.stack).slice(0,600) : '')); });
  ['error','warn'].forEach(function(lvl){
    var orig = console[lvl].bind(console);
    console[lvl] = function(){ log('CONSOLE.'+lvl+': ' + Array.prototype.map.call(arguments, function(a){ try{return a && a.message || a;}catch(_){return '';} }).join(' | ').slice(0,400)); orig.apply(null, arguments); };
  });
  log('reporter installed');
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="window.__log('JSDELIVR LOAD ERROR')"></script>

  if (Date.now()-t0 > 25000) { window.__log('GAVE UP at 25s'); return; }
  setTimeout(poll, 1000);
})();
