<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}} — {{ORG}} | Studyria Career Hub</title>
<meta name="description" content="{{DESCRIPTION}}" />
<link rel="canonical" href="{{CANONICAL_URL}}" />
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

<meta property="og:type" content="website" />
<meta property="og:title" content="{{TITLE}} — {{ORG}}" />
<meta property="og:description" content="{{DESCRIPTION}}" />
<meta property="og:image" content="{{OG_IMAGE}}" />
<meta property="og:url" content="{{CANONICAL_URL}}" />
<meta name="twitter:card" content="summary_large_image" />

<script type="application/ld+json">{{JSON_LD}}</script>

<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" />

<style>
:root {
  --color-accent:#3d8ef8; --grad-primary: linear-gradient(135deg,#3d8ef8 0%,#00c8e8 100%);
  --radius:14px; --font-display:"Playfair Display",Georgia,serif; --font-body:"Inter",system-ui,sans-serif;
  --bg:#080c14; --text:#eef2ff; --text2:#7a8caa; --glass:rgba(255,255,255,0.055); --glass-border:rgba(255,255,255,0.09);
}
* { box-sizing: border-box; }
body { margin:0; font-family:var(--font-body); background:var(--bg); color:var(--text); }
.mpa-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--glass-border); }
.mpa-logo { font-family:var(--font-display); font-size:1.4rem; font-weight:700; background:var(--grad-primary); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-decoration:none; }
.mpa-back { color:var(--text2); text-decoration:none; font-size:.9rem; }
#chJobStatic { max-width: 860px; margin: 0 auto; padding: 24px; min-height: 60vh; }
.mpa-skeleton { height: 40px; border-radius: var(--radius); background: var(--glass); animation: pulse 1.4s ease-in-out infinite; margin-bottom: 12px; }
@keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
</style>
</head>
<body>

<header class="mpa-header">
  <a class="mpa-logo" href="/">Studyria</a>
  <a class="mpa-back" href="/#career-hub">← Back to Career Hub</a>
</header>

<main id="chJobStatic">
  <h1>{{TITLE}}</h1>
  <p><strong>{{ORG}}</strong> · {{LOCATION}}</p>
  <p>{{DESCRIPTION}}</p>
  <div class="mpa-skeleton"></div>
  <noscript><p>Enable JavaScript to view full eligibility, apply link, and save/share options.</p></noscript>
</main>

<script>
  window.__STATIC_JOB_ID__ = {{JOB_ID_JSON}};
  // Tells chOpenDetail() in career-hub.js to render inline here instead
  // of redirecting to /job/<slug>.html (this IS that page).
  window.__CH_STANDALONE__ = true;
</script>

<!-- Same client stack as the SPA shell — unmodified -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script src="/career-hub.js" defer></script>
<script>
  // Reuse the EXISTING chOpenDetail() renderer from career-hub.js so the
  // full job sheet (eligibility, apply, save, share) is identical to the
  // one used inside the Career Hub SPA view — rendered into a full page
  // here instead of a bottom sheet.
  (function waitAndRender(tries) {
    tries = tries || 0;
    if (window._ch && window._ch.jobs && window._ch.jobs.length && typeof chOpenDetail === 'function') {
      // chOpenDetail renders into #chJobSheetContent by default; on this
      // standalone page we alias that id onto our static container so no
      // logic in career-hub.js needs to change.
      const target = document.getElementById('chJobStatic');
      target.id = 'chJobSheetContent';
      chOpenDetail(window.__STATIC_JOB_ID__);
      return;
    }
    if (tries < 40) return setTimeout(() => waitAndRender(tries + 1), 150);
    console.warn('[Studyria] Could not hydrate job detail — falling back to static content.');
  })();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
