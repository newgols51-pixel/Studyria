name: Fix DB Trigger (one-time)
# Run manually from GitHub Actions → "Fix DB Trigger (one-time)" → Run workflow
# Requires: SUPABASE_SERVICE_KEY secret in repo settings
on:
  workflow_dispatch: {}

jobs:
  fix-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install @supabase/supabase-js ws --no-save

      - name: Run DB trigger fix
        run: |
          node << 'EOF'
          import { createClient } from '@supabase/supabase-js';
          import ws from 'ws';
          globalThis.WebSocket = ws;

          const sb = createClient(
            process.env.SUPABASE_URL || 'https://qsdfmgcekdpjdcyqhuhi.supabase.co',
            process.env.SUPABASE_SERVICE_KEY
          );

          // We can't run DDL via PostgREST even with service role.
          // Must use Management API or SQL Editor.
          // This workflow validates that publishing works after manual fix.

          const { data, error } = await sb.from('pdfs').insert({
            title: '__CI_VERIFY_TRIGGER_FIX__',
            category: 'Education',
            category_id: 3,
            status: 'draft',
            free: true,
            price: 0,
          }).select('id').single();

          if (error) {
            console.error('❌ DB trigger still broken:', error.message);
            console.error('Please run fix-db-trigger.sql in Supabase SQL Editor first!');
            process.exit(1);
          } else {
            console.log('✅ DB trigger is fixed! Publishing works.');
            await sb.from('pdfs').delete().eq('id', data.id);
          }
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
